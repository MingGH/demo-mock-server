# 2026-08-12 重新触发 CI 部署：上一轮 run 455 的 deploy 步骤临时失败，build 与镜像推送已成功
apiVersion: v1
kind: Namespace
metadata:
  name: runnable-run
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-mock-server-deployment
  namespace: runnable-run
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-mock-server
  template:
    metadata:
      labels:
        app: demo-mock-server
    spec:
      containers:
        - name: demo-mock-server
          image: registry.cn-hongkong.aliyuncs.com/runnable-run/numfeel-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 5006   # actuator/Prometheus，仅集群内可达
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 2048Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
          # 这个 demo 冷启动包含 GeoIP/词云/SQLite 初始化，实测约 86s；
          # 启动探针成功后，liveness/readiness 才开始计时。
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5006
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: GRAFANA_LOKI_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-observability-secret
                  key: loki-user
            - name: GRAFANA_LOKI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-observability-secret
                  key: loki-token
            - name: GRAFANA_OTLP_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: grafana-observability-secret
                  key: otlp-authorization
            - name: NINJA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ninja-api-secret
                  key: token
            - name: UMAMI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: umami-secret
                  key: username
            - name: UMAMI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umami-secret
                  key: password
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: port
            - name: MYSQL_DB
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: db
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: NUMFEEL_ECHO_BASE_URL
              value: http://numfeel-echo-service.runnable-run.svc.cluster.local:8100
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: turnstile-secret
                  key: secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: demo-mock-server-service
  namespace: runnable-run
spec:
  selector:
    app: demo-mock-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-mock-server-ingress
  namespace: runnable-run
spec:
  rules:
    - host: numfeel-api.996.ninja
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-mock-server-service
                port:
                  number: 80

